  <header>

      </ul>
    </nav>
  </header>

  <main id="main-content" class="main-content">
    <section class="contact-section" aria-labelledby="page-title">
      <h1 id="page-title" class="contact-section__title">Kontakta Beetlejuice</h1>

      <!-- JS: Kopierar e-postadressen vid klick -->
      <button type="button" class="contact-section__btn"
              data-js-action="copy-email"
              data-email="beetlejuice@afterlife.se">
        Kopiera e-post
      </button>
      <p class="contact-section__status" data-js-target="copy-status" aria-live="polite"></p>

      <form class="contact-form" action="tack.php" method="post">
        <label class="contact-form__label" for="name">Namn:</label>
        <input class="contact-form__input" type="text" id="name" name="name" required>

        <label class="contact-form__label" for="email">E-post:</label>
        <input class="contact-form__input" type="email" id="email" name="email" required>

        <label class="contact-form__label" for="message">Meddelande:</label>
        <textarea class="contact-form__textarea" id="message" name="message" rows="4" required></textarea>

        <label class="contact-form__label" for="selection">Ärende</label>
        <select class="contact-form__select" id="selection" name="selection" required>
          <option value="">Välj ett ärende</option>
          <option value="Bokning">Bokning</option>
          <option value="Samarbete">Samarbete</option>
          <option value="Övrigt">Övrigt</option>
        </select>

        <button class="contact-form__submit" type="submit">Skicka</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p class="site-footer__text">Powered by Aron Alatalo and Emil Blom</p>
  </footer>
</body>
</html>
